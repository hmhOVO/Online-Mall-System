server:
  port: 9999
  tomcat:
    relaxed-query-chars: "[,]"
    relaxed-path-chars: "[,]"

spring:
  application:
    name: task-collaboration-system
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: '772103'
    url: jdbc:mysql://localhost:3306/code2026?useUnicode=true&characterEncoding=utf-8&allowMultiQueries=true&useSSL=false&serverTimezone=GMT%2b8&allowPublicKeyRetrieval=true
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
  servlet:
    multipart:
      enabled: true
      max-file-size: 20MB
      max-request-size: 50MB

mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# DeepSeek / 大模型配置
deepseek:
  enabled: true
  api-key: ${DEEPSEEK_API_KEY:your-api-key}
  base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
  model: deepseek-v4-flash
  # 非流式生成几千字符的 JSON 实际需要 70~90 秒，60 秒超时会把快完成的请求掐掉重试，反而更慢
  timeout: 300
  max-retries: 1

# AI 限流默认值（会被 sys_config 表覆盖）
ai:
  rate:
    task_split: 10
    risk_analyze: 10

# 文件上传配置
file:
  upload:
    dir: uploads
    url-prefix: /upload/
    max-size: 20MB
    allowed-types: image/jpeg,image/png,image/gif,image/webp,image/bmp,application/pdf,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document,application/vnd.ms-excel,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,application/vnd.ms-powerpoint,application/vnd.openxmlformats-officedocument.presentationml.presentation

# LibreOffice 安装目录（Windows 示例路径，Linux 默认无需配置）
jodconverter:
  office:
    home: F:\\LibreOffice
    ports: 2002,2003,2004
    max-tasks-per-process: 10
